<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>eFootball League Manager</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<header>

<h1>🏆 eFootball League</h1>

<p>League Manager</p>

</header>

<div class="container">

<!-- LİG -->

<div class="card">

<h2>Lig Bilgileri</h2>

<input
type="text"
id="leagueName"
placeholder="Lig Adı">

<input
type="text"
id="seasonName"
placeholder="Sezon">

<button id="saveLeague">

Kaydet

</button>

</div>

<!-- OYUNCULAR -->

<div class="card">

<h2>Oyuncular</h2>

<div class="row">

<input
type="text"
id="playerName"
placeholder="Oyuncu Adı">

<button id="addPlayer">

Oyuncu Ekle

</button>

</div>

<div id="playerList"></div>

</div>

<!-- FİKSTÜR -->

<div class="card">

<h2>Fikstür</h2>

<div class="row">

<select id="roundSelect"></select>

<select id="homePlayer"></select>

<select id="awayPlayer"></select>

<button id="addMatch">

Maç Ekle

</button>

</div>

<div class="row">

<button id="newRound">

+ Yeni Hafta

</button>

</div>

<div id="fixtureList"></div>

</div>

<!-- PUAN TABLOSU -->

<div class="card">

<h2>Puan Durumu</h2>

<table>

<thead>

<tr>

<th>#</th>

<th>Oyuncu</th>

<th>O</th>

<th>G</th>

<th>B</th>

<th>M</th>

<th>AG</th>

<th>YG</th>

<th>AV</th>

<th>P</th>

</tr>

</thead>

<tbody id="standings">

</tbody>

</table>

</div>

<!-- İSTATİSTİK -->

<div class="card">

<h2>Lig İstatistikleri</h2>

<div class="stats">

<div>👥 Oyuncu <span id="playerCount">0</span></div>

<div>⚽ Maç <span id="matchCount">0</span></div>

<div>✅ Oynanan <span id="playedCount">0</span></div>

<div>⌛ Kalan <span id="remainCount">0</span></div>

<div>🥅 Gol <span id="goalCount">0</span></div>

<div>📊 Ortalama <span id="goalAverage">0</span></div>

</div>

</div>

<!-- PNG -->

<div class="card">

<button id="downloadImage">

📷 Yayın Grafiği Oluştur

</button>

</div>

</div>

<div id="shareCard" class="shareCard">

    <div class="shareHeader">

        <h1 id="shareLeague"></h1>

        <h3 id="shareSeason"></h3>

    </div>

    <h2>PUAN DURUMU</h2>

    <table class="shareTable">

        <thead>

            <tr>

                <th>#</th>
                <th>Oyuncu</th>
                <th>O</th>
                <th>G</th>
                <th>B</th>
                <th>M</th>
                <th>AG</th>
                <th>YG</th>
                <th>AV</th>
                <th>P</th>

            </tr>

        </thead>

        <tbody id="shareStandings"></tbody>

    </table>
<script src="app.js"></script>

</div>
</body>

</html>
